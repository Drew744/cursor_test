# Переменные окружения для Playwright тестов
# Этот файл содержит настройки для различных сред выполнения

# Основные настройки
PLAYWRIGHT_HEADLESS: true
CI: true
NODE_ENV: test

# Настройки браузеров
PLAYWRIGHT_BROWSERS_PATH: 0
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: false

# Настройки тестов
PLAYWRIGHT_TEST_TIMEOUT: 30000
PLAYWRIGHT_TEST_RETRIES: 2
PLAYWRIGHT_TEST_WORKERS: 2

# Настройки отчетов
PLAYWRIGHT_REPORTER: html,line
PLAYWRIGHT_HTML_REPORT: playwright-report/
PLAYWRIGHT_TEST_RESULTS: test-results/

# Настройки для мониторинга
MONITORING_INTERVAL: 7200000  # 2 часа в миллисекундах
CRITICAL_PATH_TIMEOUT: 60000   # 1 минута для критических путей
BASIC_CHECK_TIMEOUT: 30000     # 30 секунд для базовых проверок

# Настройки уведомлений
NOTIFICATION_ENABLED: true
NOTIFICATION_CHANNEL: github  # github, email, slack
NOTIFICATION_ON_FAILURE: true
NOTIFICATION_ON_SUCCESS: false  # Уведомления только при ошибках

# Настройки для onliner.by
ONLINER_BASE_URL: https://onliner.by
ONLINER_CATALOG_URL: https://catalog.onliner.by
ONLINER_TEST_TIMEOUT: 60000
ONLINER_RETRY_ATTEMPTS: 3

# Настройки для различных браузеров
CHROMIUM_ENABLED: true
FIREFOX_ENABLED: false  # Отключен для экономии ресурсов
WEBKIT_ENABLED: false   # Отключен для экономии ресурсов

# Настройки кэширования
CACHE_ENABLED: true
CACHE_DURATION: 3600  # 1 час
CACHE_KEYS: |
  ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
  ${{ runner.os }}-playwright-${{ hashFiles('**/playwright.config.js') }}

# Настройки артефактов
ARTIFACT_RETENTION_DAYS: 30
ARTIFACT_COMPRESSION: true
ARTIFACT_INCLUDE_PATTERNS: |
  playwright-report/**
  test-results/**
  screenshots/**
  videos/**

# Настройки безопасности
SECURITY_SCAN_ENABLED: false
DEPENDENCY_CHECK_ENABLED: true
VULNERABILITY_SCAN_ENABLED: false

# Настройки производительности
PERFORMANCE_MONITORING: false
LIGHTHOUSE_ENABLED: false
METRICS_COLLECTION: false
