name: Playwright Tests
on:
  # Запуск при push и pull request
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  
  # Автоматический запуск по расписанию
  schedule:
    # Каждый день в 9:00 UTC (12:00 по Москве)
    - cron: '0 9 * * *'
    # Каждые 6 часов
    - cron: '0 */6 * * *'
    # Каждый понедельник в 8:00 UTC
    - cron: '0 8 * * 1'
  
  # Ручной запуск из GitHub UI
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Тип тестов для запуска'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - smoke
        - onliner
      browser:
        description: 'Браузер для тестирования'
        required: false
        default: 'chromium'
        type: choice
        options:
        - chromium
        - firefox
        - webkit

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    # Запуск только при определенных условиях для cron
    if: |
      github.event_name != 'schedule' || 
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      run: |
        if [ "${{ github.event.inputs.test_type }}" = "smoke" ]; then
          npx playwright test --grep "smoke" --project=chromium
        elif [ "${{ github.event.inputs.test_type }}" = "onliner" ]; then
          npx playwright test --grep "onliner" --project=chromium
        else
          npx playwright test --project=chromium
        fi
      env:
        # Переменные окружения для тестов
        CI: true
        PLAYWRIGHT_HEADLESS: true
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ github.run_id }}
        path: |
          playwright-report/
          test-results/
        retention-days: 30
        
    - name: Upload test results to GitHub
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  # Отдельный job для мониторинга доступности сайта
  availability-check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    
    # Запуск каждые 2 часа
    if: github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Check site availability
      run: npx playwright test --grep "onliner.by доступен" --project=chromium
      
    - name: Upload availability report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: availability-check-${{ github.run_id }}
        path: playwright-report/
        retention-days: 7
